services:
  ind-incident:
    build:
      context: .
    image: ind-incident:latest
    container_name: ind-incident
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Die Anwendung hält keine Daten auf dem Server – Unternehmensprofil und
      # Vorfallentwürfe liegen im Browser. Es gibt deshalb kein Volume und
      # keine weiteren Umgebungsvariablen.
      TZ: ${TZ:-Europe/Berlin}
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"

      # ---- HTTP router (entrypoint: http) — redirects to HTTPS ----
      - "traefik.http.routers.ind-incident-http.rule=Host(`${APP_DOMAIN:-threatly.graysec.de}`)"
      - "traefik.http.routers.ind-incident-http.entrypoints=http"
      - "traefik.http.routers.ind-incident-http.middlewares=ind-incident-redirect"
      - "traefik.http.routers.ind-incident-http.service=ind-incident"

      # Redirect middleware: force HTTPS
      - "traefik.http.middlewares.ind-incident-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.ind-incident-redirect.redirectscheme.permanent=true"

      # ---- HTTPS router (entrypoint: https, TLS via cloudflare, auth via tinyauth) ----
      - "traefik.http.routers.ind-incident-https.rule=Host(`${APP_DOMAIN:-threatly.graysec.de}`)"
      - "traefik.http.routers.ind-incident-https.entrypoints=https"
      - "traefik.http.routers.ind-incident-https.tls=true"
      - "traefik.http.routers.ind-incident-https.middlewares=tinyauth@docker"
      - "traefik.http.routers.ind-incident-https.service=ind-incident"

      # ---- Service ----
      - "traefik.http.services.ind-incident.loadbalancer.server.port=3000"
networks:
  traefik:
    external: true
