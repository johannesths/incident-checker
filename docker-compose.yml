# Stack für Portainer: Traefik und die Anwendung in einem Netzwerk.
#
# Der Stack bringt seinen eigenen Traefik mit und veröffentlicht nur dessen
# Port. Erreichbar ist die Anwendung damit unter http://<host>/ – ohne
# Hostnamen, ohne Zertifikat.
#
# Einstellbar sind:
#
#   HTTP_PORT   Host-Port für Traefik (Vorgabe: 80)
#   TZ          Zeitzone im Container (Vorgabe: Europe/Berlin)
#
# Läuft auf demselben Host bereits ein anderer Stack nach diesem Muster,
# belegt dessen Traefik Port 80 und den Containernamen "traefik". Dann
# entweder HTTP_PORT setzen und den Containernamen hier ändern – oder die
# Anwendung an den vorhandenen Traefik hängen: Dazu entfällt der Dienst
# "traefik", das Netzwerk wird auf "external: true" gestellt, und der
# Anwendung kommt ein Label mit der Regel hinzu, unter der sie erreichbar sein
# soll.
#
# Soll statt eines lokal gebauten ein fertiges Abbild laufen, "build" durch
# "image: <registry>/ind-incident:<tag>" ersetzen.

services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      # Nur Container mit traefik.enable=true werden geroutet.
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      # Lesend: Traefik liest die Labels der Container, es startet keine.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [app]

  ind-incident:
    build:
      context: .
    image: ind-incident:latest
    container_name: ind-incident
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Die Anwendung hält keine Daten auf dem Server – Unternehmensprofil und
      # Vorfallentwürfe liegen im Browser. Es gibt deshalb kein Volume und
      # keine weiteren Umgebungsvariablen.
      TZ: ${TZ:-Europe/Berlin}
    networks: [app]
    labels:
      - traefik.enable=true
      # Der Container veröffentlicht keinen Port; Traefik braucht ihn deshalb
      # ausdrücklich.
      - traefik.http.services.ind-incident.loadbalancer.server.port=3000
      # Ein Dienst für alles: Next.js liefert die Seiten und /api aus demselben
      # Prozess aus, eine Aufteilung nach Pfaden erübrigt sich.
      - traefik.http.routers.ind-incident.rule=PathPrefix(`/`)
      - traefik.http.routers.ind-incident.entrypoints=web

networks:
  app:
